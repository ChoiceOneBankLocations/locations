        /* ChoiceOne Brand Colors */
        :root {
            --color-teal: #116E6F; /* Main Teal */
            --color-cyan: #009fd7; /* Main Cyan */
            --color-dark-teal: #0D5657; /* Darker Teal for hover/active */
            --color-light-gray: #f3f4f6;
        }
        .text-teal { color: var(--color-teal); }
        .bg-teal { background-color: var(--color-teal); }
        .text-cyan { color: var(--color-cyan); }
        .text-brand-teal { color: var(--color-teal); } 
        /* Custom class for the Loan Office asterisk to maintain font/size but increase weight */
        .loan-asterisk { font-weight: 700; } 

        /* Standardize the look of the hours text itself */
        .hours-text-normal {
            color: #4b5563; /* Tailwind gray-700 equivalent for consistency */
            font-size: 0.875rem; /* text-sm equivalent */
        }

        body {
            font-family: 'Inter', sans-serif;
            color: #1a1a1a;
            padding: 0;
            margin: 0;
            line-height: 1.4;
            scroll-padding-top: 3rem; 
        }

        /* Styling for the alphabet menu buttons */
        .alphabet-button {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 1.8rem; 
            height: 1.8rem;
            font-size: 0.75rem; 
            font-weight: 600;
            border-radius: 5px; 
            transition: all 0.2s ease-in-out;
            text-decoration: none;
            user-select: none;
            flex-shrink: 0;
            background-color: var(--color-teal);
            color: white;
            box-shadow: 0 1px 3px rgba(17, 110, 111, 0.4);
        }

        .alphabet-button:hover {
            background-color: var(--color-dark-teal);
            transform: scale(1.1);
        }

        /* Ensure main content takes up most space on all devices and leaves room for the side menu */
        .location-directory {
            padding-right: 6.5rem !important; 
            padding-top: 3rem !important; 
        }

        /* NEW PRINT/PDF FIXES */
        @media print {
            .location-content-wrapper {
                page-break-inside: avoid;
            }
            #side-alphabet-menu {
                display: none !important;
            }
            .location-directory {
                padding-right: 1.5rem !important; 
                padding-top: 1.5rem !important; 
            }
        }
    </style>

        <div id="location-list">

                // Define the consistent ITM hours
                const ITM_HOURS_TEXT = 'M-F 7:00 – 7:00, Sat. 9:00 – 5:00, Sun. 11:00- 3:00';

                const locationList = document.getElementById('location-list');
                
                availableSections.forEach((section) => {
                    const locations = groupedData[section];

                    // 1. Add the Section Header
                    const sectionHeader = document.createElement('div');
                    sectionHeader.className = 'section-header mt-8 mb-2';
                    sectionHeader.innerHTML = `
                        <h2 id="${section}" class="text-2xl font-extrabold uppercase text-teal border-b-4 border-cyan inline-block pb-1" style="letter-spacing: 0.1em;">${section}</h2>
                    `;
                    locationList.appendChild(sectionHeader);

                    // 2. Add each Location Entry
                    locations.forEach(location => {
                        const addressText = location.address.replace(/\n\s*/g, ' ');
                        
                        const searchQuery = `${location.name} ChoiceOne Bank, ${addressText}`; 
                        const mapUrl = getMapUrl(searchQuery); 

                        // Initialize content variables
                        let hoursContent = '';
                        let hoursClass = 'flex flex-wrap gap-x-8 gap-y-1 text-sm md:text-xs';
                        let atmNote = ''; 
                        let itmNote = '';


                        // --- ATM NOTE (always first after address) ---
                        if (location.hasATM24 === true) {
                            atmNote = '<p class="text-sm font-semibold text-teal mt-1">24 Hour ATM Available</p>';
                        }


                        // --- HOURS CONTENT LOGIC ---

                        const isNamedATM = location.name.toUpperCase().includes("ATM");
                        const isATMOnly = location.type === "ATM Only";
                        const isLoanOffice = location.type === "Loan Office";


                        if (isATMOnly) {
                             // If it's an ATM-Only location, suppress the hours content block entirely 
                             // if the ATM label is in the name, otherwise show "ATM ONLY".
                             if (!isNamedATM) {
                                hoursContent = `<p class="text-gray-600 font-semibold text-lg">ATM ONLY</p>`;
                                hoursClass = 'text-center'; 
                             } else {
                                hoursContent = ``;
                                hoursClass = '';
                             }
                        } else if (isLoanOffice) {
                            // LOAN OFFICE / WEALTH MANAGEMENT
                            hoursContent = `
                                <p class="hours-text-normal">
                                    <span class="font-semibold text-gray-800">Lobby Hours:</span> By Appointment Only<span class="loan-asterisk">*</span>
                                </p>
                            `;
                            // Use standard hours class for left alignment
                            hoursClass = 'flex flex-wrap gap-x-8 gap-y-1 text-sm md:text-xs';
                        } else {
                            // STANDARD BRANCH LOGIC
                            const lobbyText = location.lobby || 'None listed';
                            let driveUpHoursDisplay = location.driveUp || 'None listed';

                            hoursContent = `
                                <p class="hours-text-normal">
                                    <span class="font-semibold text-gray-800">Lobby:</span> ${lobbyText}
                                </p>
                            `;
                            
                            // Only show Drive Up if it's actual hours or "None listed", not the ITM placeholder
                            if (driveUpHoursDisplay && driveUpHoursDisplay !== 'None listed' && driveUpHoursDisplay !== 'Live Video Teller Available') {
                                hoursContent += `
                                    <p class="hours-text-normal">
                                        <span class="font-semibold text-gray-800">Drive Up:</span> ${driveUpHoursDisplay}
                                    </p>
                                `;
                            }
                            hoursClass = 'flex flex-wrap gap-x-8 gap-y-1 text-sm md:text-xs';
                        }
                        
                        
                        // --- ITM NOTE LOGIC (Always a separate block) ---
                        if (location.isITM === true) {
                            // Add a top margin for spacing, adjusting if no hours content was rendered (e.g. Loan Office with only ITM or Named ATM Only)
                            const topMargin = (hoursContent.trim().length > 0) ? 'mt-3' : 'mt-1';

                            itmNote = `
                                <div class="${topMargin} text-sm text-center md:text-left">
                                    <p class="font-semibold text-cyan">ITM (Live Video Teller) Hours:</p>
                                    <p class="hours-text-normal">${ITM_HOURS_TEXT}</p>
                                </div>
                            `;
                        }

                        // Combine all parts into the final HTML structure
                        const locationEntry = document.createElement('div');
                        locationEntry.className = 'location-entry transition duration-150 hover:bg-gray-50 border-b border-gray-100 py-4';
                        locationEntry.innerHTML = `
                            <div class="location-content-wrapper px-2">
                                <h3 class="text-lg font-bold uppercase text-gray-800">${location.name}</h3>
                                <div class="text-gray-600 text-sm mb-2">
                                    <a href="${mapUrl}" target="_blank"
                                       class="block text-cyan font-medium underline hover:text-blue-700 transition duration-150">
                                        ${addressText}
                                    </a>
                                </div>
                                
                                ${atmNote} 

                                <div class="mt-1 ${hoursClass}">
                                    ${hoursContent}
                                </div>
                                
                                ${itmNote}
                            </div>
                        `;
                        locationList.appendChild(locationEntry);
                    });
                });
            </script>
        </div>
        
        <div class="mt-12 text-center text-gray-400 text-xs border-t pt-4 px-4 pb-8">
            <p>Revised November 2025</p>
        </div>

    </div>

</body>
</html>
