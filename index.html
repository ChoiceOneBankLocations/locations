        /* ChoiceOne Brand Colors */
        :root {
            --color-teal: #116E6F; /* Main Teal */

            --color-dark-teal: #0D5657; /* Darker Teal for hover/active */
            --color-light-gray: #f3f4f6;
        }
        .text-teal { color: var(--color-teal); }

        .text-cyan { color: var(--color-cyan); }

        body {
            font-family: 'Inter', sans-serif;
            color: #1a1a1a;
            padding: 0;
            margin: 0;
            line-height: 1.4;
            /* Added scroll padding to account for the menu starting position (top-12) */
            scroll-padding-top: 3rem; 
        }

        /* Styling for the alphabet menu buttons */
        .alphabet-button {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 1.8rem; 
            height: 1.8rem;
            font-size: 0.75rem; 
            font-weight: 600;
            border-radius: 5px; 
            transition: all 0.2s ease-in-out;
            text-decoration: none;
            user-select: none;
            flex-shrink: 0;
            background-color: var(--color-teal);
            color: white;
            box-shadow: 0 1px 3px rgba(17, 110, 111, 0.4);
        }

        .alphabet-button:hover {
            background-color: var(--color-dark-teal);
            transform: scale(1.1);
        }

        /* Hide the side menu on desktop and only show it on mobile/narrow screens */
        @media (min-width: 768px) {
            #side-alphabet-menu {
                display: none;
            }
        }
        /* Ensure main content takes up most space on mobile */
        @media (max-width: 767px) {
             .location-directory {
                /* FINAL GUARANTEED FIX: Increased padding to 6.5rem to ensure clearance */
                padding-right: 6.5rem !important; 
                padding-top: 3rem !important; 
            }
        }

    <div class="location-directory pt-4 pb-4 pl-4 md:p-6 bg-white max-w-4xl mx-auto">
        
        <div class="text-center mb-6">

        </div>
        
        <h1 class="text-3xl font-bold text-gray-900 mb-2">ChoiceOne Bank Locations</h1>
        
        <div class="mb-8"></div> 

        <div id="side-alphabet-menu" class="fixed right-0 top-12 z-50 p-2 bg-white rounded-l-lg shadow-xl border border-gray-200">
            <div class="w-full flex flex-col justify-center items-center gap-1">
                <script>
                    const menuContainer = document.querySelector('#side-alphabet-menu > div');
                    
                    availableSections.forEach(letter => {
                        const item = document.createElement('a');
                        item.href = `#${letter}`; 
                        
                        item.className = 'alphabet-button';
                        item.textContent = letter;
                        menuContainer.appendChild(item);
                    });
                </script>
            </div>
        </div>

        <div id="location-list">
            <script>
                const locationList = document.getElementById('location-list');
                
                availableSections.forEach((section) => {
                    const locations = groupedData[section];

                    // 1. Add the Section Header
                    const sectionHeader = document.createElement('div');
                    sectionHeader.className = 'section-header mt-8 mb-2';
                    sectionHeader.innerHTML = `
                        <h2 id="${section}" class="text-2xl font-extrabold uppercase text-teal border-b-4 border-cyan inline-block pb-1" style="letter-spacing: 0.1em;">${section}</h2>
                    `;
                    locationList.appendChild(sectionHeader);

                    // 2. Add each Location Entry
                    locations.forEach(location => {
                        const driveUpText = location.driveUp || 'None listed';
                        const lobbyText = location.lobby || 'None listed';
                        const addressText = location.address.replace(/\n\s*/g, ' ');
                        const encodedAddress = encodeURIComponent(addressText);
                        const mapUrl = `http://googleusercontent.com/maps.apple.com/2{encodedAddress}`;
                        
                        const locationEntry = document.createElement('div');
                        locationEntry.className = 'location-entry transition duration-150 hover:bg-gray-50 border-b border-gray-100 py-4';
                        locationEntry.innerHTML = `
                            <div class="px-2">
                                <h3 class="text-lg font-bold uppercase text-gray-800">${location.name}</h3>
                                <div class="text-gray-600 text-sm mb-2">
                                    <a href="${mapUrl}" target="_blank"
                                       class="block text-cyan font-medium underline hover:text-blue-700 transition duration-150">
                                        ${addressText}
                                    </a>
                                </div>
                                
                                <div class="flex flex-wrap gap-x-8 gap-y-1 text-sm md:text-xs">
                                    <p class="text-gray-600">
                                        <span class="font-semibold text-gray-800">Lobby:</span> ${lobbyText}
                                    </p>
                                    <p class="text-gray-600">
                                        <span class="font-semibold text-gray-800">Drive Up/ITM:</span> ${driveUpText}
                                    </p>
                                </div>
                            </div>
                        `;
                        locationList.appendChild(locationEntry);
                    });
                });
            </script>
        </div>
        
        <div class="mt-12 text-center text-gray-400 text-xs border-t pt-4 px-4 pb-8">
            <p>Revised November 2025.</p>
